# Production stack: MongoDB + the API + the mood-aggregation scheduler,
# fronted by Caddy for automatic HTTPS. Run with:
#
#   docker compose up -d --build
#
# See README.md "Docker deployment" for full setup instructions.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-citizenpulse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Not published to the host - only reachable by other containers on
    # this compose network. The API talks to it via the service name "mongo".
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    # image: ghcr.io/easylifetechnologiesltd/masauti:latest
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-citizenpulse}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:27017/masauti?authSource=admin&retryWrites=true&w=majority
    ports:
    - "127.0.0.1:8089:4000"
    labels:
      - traefik.enable
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN?:set API_DOMAN in .env}`)"
      - traefik.http.services.api.loadbalancer.server.port=${PORT:-4000}
volumes:
  mongo_data:
  caddy_data:
  caddy_config:
